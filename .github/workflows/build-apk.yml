name: Build Flutter APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get
      working-directory: cold_day_flutter

    - name: Run tests
      run: flutter test
      working-directory: cold_day_flutter

    - name: Validate Google Maps API key
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      run: |
        if [ -z "${MAPS_API_KEY:-}" ]; then
          echo "MAPS_API_KEY secret is required for APK builds" >&2
          exit 1
        fi

    - name: Build APK
      run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=BACKEND_ENDPOINT=${{ secrets.BACKEND_ENDPOINT }}
      working-directory: cold_day_flutter
      env:
        ORG_GRADLE_PROJECT_GOOGLE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cold-day-app-apk
        path: cold_day_flutter/build/app/outputs/flutter-apk/app-release.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: cold_day_flutter/build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
