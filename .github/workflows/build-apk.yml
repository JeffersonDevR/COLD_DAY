name: Build Flutter APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get
      working-directory: cold_day_flutter

    - name: Run tests
      run: flutter test
      working-directory: cold_day_flutter

    - name: Inject Google Maps API Key
      run: |
        sed -i "s/YOUR_GOOGLE_MAPS_API_KEY_HERE/${{ secrets.MAPS_API_KEY }}/g" android/app/src/main/AndroidManifest.xml
      working-directory: cold_day_flutter

    - name: Build APK
      run: flutter build apk --release --android-skip-build-dependency-validation
      working-directory: cold_day_flutter

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cold-day-app-apk
        path: cold_day_flutter/build/app/outputs/flutter-apk/app-release.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: cold_day_flutter/build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
